<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1.0 reference chrome (C42)</title>
  <link rel="stylesheet" href="http://127.0.0.1:8765/static/css/fonts.css" />
  <link rel="stylesheet" href="http://127.0.0.1:8765/static/css/style.css" />
</head>
<body>
<div class="app-shell">
  <header class="site-header">
    <div class="container header-inner">
      <div class="header-left">
        <a href="#" class="logo">
          <span class="logo-mark">W</span>
          <span class="logo-text">WowLance</span>
        </a>
      </div>
      <nav class="nav-menu">
        <a href="#">Дашборд</a>
        <a href="#">Проекты</a>
        <span class="user-role">Тимлид</span>
        <button type="button" class="btn btn-ghost btn-sm">Выйти</button>
      </nav>
    </div>
  </header>
  <main class="container">
    <div class="page-header">
      <div>
        <p><a href="#">← Проекты</a></p>
        <div class="room-title-row">
          <h1>Demo Cold Calling</h1>
        </div>
        <p class="subtitle">Статус: в работе · Тимлид: Demo Teamlead</p>
      </div>
    </div>
    <nav class="room-tabs" aria-label="Разделы комнаты">
      <a href="#" class="active">Обзор</a>
      <a href="#">Команда</a>
      <a href="#">Задачи</a>
      <a href="#">Лиды</a>
      <a href="#">Материалы</a>
      <a href="#">Коммуникации</a>
    </nav>
    <section class="card">
      <h2>Команда</h2>
      <p class="muted">seller #1 · занят · seller #2 · свободен</p>
      <p>
        <button type="button" class="btn btn-primary btn-sm">Assign</button>
        <button type="button" class="btn btn-secondary btn-sm">Unassign</button>
      </p>
    </section>
    <section class="card" style="margin-top: 16px">
      <h2>Задачи</h2>
      <p>Demo first dials · submitted</p>
      <p>
        <button type="button" class="btn btn-primary btn-sm">Accept</button>
        <button type="button" class="btn btn-secondary btn-sm">Reject</button>
      </p>
    </section>
  </main>
</div>
</body>
</html>
