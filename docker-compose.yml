services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wowlance
      POSTGRES_PASSWORD: wowlance
      POSTGRES_DB: wowlance
    ports:
      # 5433 on host — avoid clash with a local Windows PostgreSQL on 5432
      - "5433:5432"
    volumes:
      - wowlance_pg:/var/lib/postgresql/data
      # Creates wowlance_test on first init only (empty volume).
      - ./docker/init-create-test-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wowlance -d wowlance"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://wowlance:wowlance@db:5432/wowlance
      APP_ENV: local
      AUTH_DISABLED: "true"
      INTERNAL_AUTH_DISABLED: "true"
      ROOM_RBAC_DISABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # 8088 on host — 8080 is often taken (other stacks)
      - "8088:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  wowlance_pg:
