# OpenSpec / contract draft — TalentRosterUpsert v1
# Stub upsert of a freelancer into the local roster.

id: TalentRosterUpsert
version: "1"
direction: Talent -> WowLance
channel: https

paths:
  upsert:
    method: POST
    path: /internal/v1/roster
    headers: []
    direction: Talent -> WowLance
  list:
    method: GET
    path: /api/v1/roster
    direction: client -> WowLance
    note: "локальный roster для assign/match picker (не live Talent)"

request:
  type: object
  required: [freelancer_sub, display_name]
  properties:
    freelancer_sub:
      type: string
    display_name:
      type: string
    skills:
      type: array
      items: { type: string }
      nullable: true
    level:
      type: string
      nullable: true
    source:
      type: string
      enum: [stub, talent]
      default: stub

response_200:
  type: object
  required: [freelancer_sub, status]
  properties:
    freelancer_sub: { type: string }
    status:
      type: string
      enum: [upserted, already_exists]

response_list_200:
  type: object
  required: [members]
  properties:
    members:
      type: array
      items:
        type: object
        required: [freelancer_sub, display_name]
        properties:
          freelancer_sub: { type: string }
          display_name: { type: string }
          skills: { type: array, items: { type: string }, nullable: true }
          level: { type: string, nullable: true }
          source: { type: string, enum: [stub, talent] }
