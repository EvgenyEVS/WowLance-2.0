# OpenSpec / contract draft — HotLeadToCrm v1 (C9)
# Outbound event when a hot lead leaves WowLance for the CRM (production: Order/CRM).
# C9 scope: persist into the local outbox (status=sent, sync stub); live HTTP is later.

id: HotLeadToCrm
version: "1"
direction: WowLance -> CRM
channel: https_or_outbox
idempotency_key: lead_id

payload:
  type: object
  required: [lead_id, room_id, title, handed_at]
  properties:
    lead_id: { type: string, format: uuid }
    room_id: { type: string, format: uuid }
    title: { type: string }
    contact_name: { type: string, nullable: true }
    contact_email: { type: string, nullable: true }
    notes: { type: string, nullable: true }
    founder_sub: { type: string }
    room_name: { type: string }
    handed_at: { type: string, format: date-time }

outbox:
  table: outbox_messages
  event_type: HotLeadToCrm
  status:
    enum: [pending, sent, failed]
    c9: sent
  columns: [id, event_type, idempotency_key, payload, status, created_at, sent_at]
  unique: idempotency_key

crm_stub:
  crm_ref: "crm-stub:<lead_id>"
  note: "no live CRM call, no OAuth, no Keycloak"
