# OpenSpec / contract draft — StaffingSlots v1 (C4) + SlotAssign (C6) + C12
# Materialize seats from the local strategy snapshot after entitlement.
# Locked rooms: 403. Unknown room: 404. Explicit POST materialize (not lazy GET).
# C6 assign: seat an open slot with a freelancer already in the local roster.
# Requires the stub header X-Actor-Sub (missing: 422). Idempotent on repeat.
# C12 unassign: filled -> open (freelancer_sub cleared); 409 slot_not_filled otherwise.
# C12 reassign: swap the person on an already filled slot; 409 slot_not_filled on open.
# C22 rematerialize: sync seats to active staffing_intent — add open, cancel extra open,
# filled orphans reported in orphaned_filled (не сносятся автоматически). Явный POST.

id: StaffingSlots
version: "1"
direction: client -> WowLance
channel: https

paths:
  list:
    method: GET
    path: /api/v1/rooms/{room_id}/slots
  materialize:
    method: POST
    path: /api/v1/rooms/{room_id}/slots/materialize
  assign:
    method: POST
    path: /api/v1/rooms/{room_id}/slots/{slot_id}/assign
    headers: [X-Actor-Sub]
    request:
      type: object
      required: [freelancer_sub]
      properties:
        freelancer_sub: { type: string }
  unassign:
    method: POST
    path: /api/v1/rooms/{room_id}/slots/{slot_id}/unassign
    headers: [X-Actor-Sub]
    request: { type: object }   # пустое тело
  reassign:
    method: POST
    path: /api/v1/rooms/{room_id}/slots/{slot_id}/reassign
    headers: [X-Actor-Sub]
    request:
      type: object
      required: [freelancer_sub]
      properties:
        freelancer_sub: { type: string }
  rematerialize:
    method: POST
    path: /api/v1/rooms/{room_id}/slots/rematerialize

slot:
  type: object
  required: [id, room_id, role_key, seat_index, status]
  properties:
    id: { type: string, format: uuid }
    room_id: { type: string, format: uuid }
    role_key: { type: string }
    seat_index: { type: integer, minimum: 1 }
    level_min: { type: string, nullable: true }
    status:
      type: string
      enum: [open, filled, cancelled]
    freelancer_sub: { type: string, nullable: true }

response_list_200:
  type: object
  required: [room_id, staffing_unlocked, slots]
  properties:
    room_id: { type: string, format: uuid }
    staffing_unlocked: { type: boolean, const: true }
    slots:
      type: array
      items: { $ref: "#/slot" }

response_materialize_200:
  type: object
  required: [room_id, status, slots]
  properties:
    room_id: { type: string, format: uuid }
    status:
      type: string
      enum: [materialized, already_materialized]
    slots:
      type: array
      items: { $ref: "#/slot" }

response_assign_200:
  type: object
  required: [slot, status]
  properties:
    slot: { $ref: "#/slot" }
    status:
      type: string
      enum: [assigned, already_assigned]

response_unassign_200:
  type: object
  required: [slot, status]
  properties:
    slot: { $ref: "#/slot" }   # status: open, freelancer_sub: null
    status:
      type: string
      enum: [unassigned]

response_reassign_200:
  type: object
  required: [slot, status]
  properties:
    slot: { $ref: "#/slot" }   # status: filled, новый freelancer_sub
    status:
      type: string
      enum: [reassigned, already_assigned]

response_rematerialize_200:
  type: object
  required: [room_id, status, slots]
  properties:
    room_id: { type: string, format: uuid }
    status:
      type: string
      enum: [rematerialized, already_synced]
    slots:
      type: array
      items: { $ref: "#/slot" }
    orphaned_filled:
      type: array
      items: { $ref: "#/slot" }

errors:
  - { code: 403, when: "staffing_unlocked is false (detail: staffing_locked)" }
  - { code: 404, when: "room_id does not exist" }
  - { code: 404, when: "assign: slot_id not in room or freelancer_sub not in roster (detail: slot_id does not exist in this room / freelancer_not_in_roster)" }
  - { code: 404, when: "unassign/reassign: slot_id not in room or reassign freelancer_sub not in roster (detail: slot_id does not exist in this room / freelancer_not_in_roster)" }
  - { code: 409, when: "assign: slot already filled by another (slot_already_filled) or freelancer already seated in this room (already_seated)" }
  - { code: 409, when: "unassign/reassign: slot is not filled (slot_not_filled); reassign sub already seated elsewhere (already_seated)" }
  - { code: 403, when: "rematerialize: staffing_unlocked is false (detail: staffing_locked)" }
  - { code: 404, when: "rematerialize: room_id does not exist" }
  - { code: 422, when: "validation failed or missing X-Actor-Sub on assign/unassign/reassign" }
