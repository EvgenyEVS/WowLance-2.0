# OpenSpec / contract draft — RoomRead v1
# Read-only view of a room + strategy snapshot for the C3 React shell.

id: RoomRead
version: "1"
direction: client -> WowLance
channel: https
path: /api/v1/rooms/{room_id}
method: GET

response_200:
  type: object
  required:
    - id
    - name
    - room_type
    - timezone
    - founder_sub
    - staffing_unlocked
    - strategy
  properties:
    id: { type: string, format: uuid }
    name: { type: string }
    room_type:
      type: string
      enum: [sale, develop]
    timezone: { type: string }
    founder_sub: { type: string }
    handoff_id: { type: string, format: uuid }
    staffing_unlocked: { type: boolean }
    meeting_url: { type: string, nullable: true }
    created_at: { type: string, format: date-time }
    strategy:
      type: object
      required: [strategy_id, strategy_version, offer, audience, hot_criteria]
      properties:
        strategy_id: { type: string, format: uuid }
        strategy_version: { type: string }
        offer: { type: string }
        audience: { type: string }
        hot_criteria: { type: string }
        utp: { type: string }
        documents:
          type: array
          items:
            type: object
            required: [role, uri, checksum]
            properties:
              role: { type: string }
              uri: { type: string }
              checksum: { type: string }
        staffing_intent:
          type: object
          nullable: true
    viewer_role:
      type: string
      nullable: true
      enum: [founder, teamlead, member]
      description: Role of X-Actor-Sub / JWT sub in this room, if any (C27).
    rbac_enforced:
      type: boolean
      description: true when ROOM_RBAC_DISABLED=false
    pending_strategy:
      type: object
      nullable: true
      description: Present while a StrategyPublished proposal is pending. strategy is always the active snapshot.
      properties:
        proposal_id: { type: string, format: uuid }
        strategy_version: { type: string }
        offer: { type: string }
        audience: { type: string }
        hot_criteria: { type: string }
        status:
          type: string
          const: pending

errors:
  - { code: 404, when: "room_id does not exist" }
