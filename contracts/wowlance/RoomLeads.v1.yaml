# OpenSpec / contract draft — RoomLeads v1 (C9)
# Leads live inside a room (own DB only). Lifecycle: open -> hot -> handed_to_crm.
# Mutations require the stub header X-Actor-Sub (missing: 422), same as C5–C7.

id: RoomLeads
version: "1"
direction: client -> WowLance
channel: https

lead:
  type: object
  required: [id, room_id, title, status, created_at]
  properties:
    id: { type: string, format: uuid }
    room_id: { type: string, format: uuid }
    title: { type: string }
    contact_name: { type: string, nullable: true }
    contact_email: { type: string, nullable: true }
    notes: { type: string, nullable: true }
    status:
      type: string
      enum: [open, hot, handed_to_crm]
    crm_ref: { type: string, nullable: true }
    deal_status: { type: string, nullable: true }
    deal_amount: { type: number, nullable: true }
    deal_currency: { type: string, nullable: true }
    deal_updated_at: { type: string, format: date-time, nullable: true }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }

paths:
  list:
    method: GET
    path: /api/v1/rooms/{room_id}/leads
  create:
    method: POST
    path: /api/v1/rooms/{room_id}/leads
    headers: [X-Actor-Sub]
    request:
      required: [title]
      properties:
        title: { type: string }
        contact_name: { type: string, nullable: true }
        contact_email: { type: string, nullable: true }
        notes: { type: string, nullable: true }
  mark_hot:
    method: POST
    path: /api/v1/rooms/{room_id}/leads/{lead_id}/mark-hot
    headers: [X-Actor-Sub]
  handoff:
    method: POST
    path: /api/v1/rooms/{room_id}/leads/{lead_id}/handoff-crm
    headers: [X-Actor-Sub]
  deal_status:
    method: POST
    path: /internal/v1/crm/deal-status
    request:
      required: [crm_ref, deal_status]
      properties:
        crm_ref: { type: string }
        deal_status: { type: string, enum: [won, lost, in_progress, unknown] }
        amount: { type: number, nullable: true }
        currency: { type: string, nullable: true }

transitions:
  create: "-> open"
  mark_hot: "open -> hot; repeat on hot/handed_to_crm: 409"
  handoff: "hot -> handed_to_crm + outbox HotLeadToCrm (status=sent), crm_ref = crm-stub:<lead_id>"
  handoff_repeat: "handed_to_crm -> 200 already_handed (idempotent by lead_id)"
  handoff_from_open: "open -> 409"

response_list_200:
  type: object
  required: [room_id, leads]
  properties:
    room_id: { type: string, format: uuid }
    leads:
      type: array
      items: { $ref: "#/lead" }

response_handoff_200:
  type: object
  required: [lead, crm_ref, status]
  properties:
    lead: { $ref: "#/lead" }
    crm_ref: { type: string }
    status:
      type: string
      enum: [handed, already_handed]

response_deal_status_200:
  type: object
  required: [room_id, lead_id, crm_ref, deal_status, deal_updated_at]
  properties:
    room_id: { type: string, format: uuid }
    lead_id: { type: string, format: uuid }
    crm_ref: { type: string }
    deal_status:
      type: string
      enum: [won, lost, in_progress, unknown]
    deal_amount: { type: number, nullable: true }
    deal_currency: { type: string, nullable: true }
    deal_updated_at: { type: string, format: date-time }

errors:
  - { code: 404, when: "room or lead missing" }
  - { code: 404, when: "crm_ref does not match any lead (deal-status)" }
  - { code: 409, when: "illegal transition (mark-hot on non-open; handoff from open)" }
  - { code: 409, when: "lead is not in handed_to_crm (lead_not_handed; deal-status)" }
  - { code: 422, when: "validation or missing X-Actor-Sub on mutating routes" }
